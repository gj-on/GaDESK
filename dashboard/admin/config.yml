backend:
  name: git-gateway
  branch: "48892"

media_folder: "assets"
public_folder: "/assets"

collections:
  - name: "pagine_it"
    label: "Pagine"
    folder: "content/pagine"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
      - { name: "title", label: "Titolo", widget: "string" }
      - { name: "date", label: "Data", widget: "datetime", default: "", hidden: true }
      - { name: "permalink", label: "Link personalizzato", widget: "string", required: true }
      - { name: "body", label: "page", widget: "markdown" }
  - name: "posts"
    label: "Post"
    label_singular: "Post"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "posts/{{slug}}"
    sortable_fields: ['date', 'title']
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "Categoria", name: "categories", widget: "list", default: ["notizie"] }
      - { label: "Tag", name: "tags", widget: "list" }
      - { label: "Contenuto", name: "body", widget: "markdown" }
      - { label: "Autore", name: "autore", widget: "string", default: "Redazione: Gabriel Matteo Jones" }
  - name: "private_pages"
    label: "Pagine ad autorizzazione"
    folder: "content/private/"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "riservato" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Corpo", name: "body", widget: "markdown" }

  - name: "desk"
    label: "Desk"
    folder: "_cartella"     # cartella che conterrà i vari .md
    create: true               # consente di creare nuovi file
    slug: "{{slug}}"           # nome file automatico
    extension: "md"
    format: "frontmatter"
    summary: "{{title}}"

    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "desk" }
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Permalink", name: "permalink", widget: "string" }

      - label: "Files"
        name: "files"
        widget: "list"
        summary: "{{fields.title}}"
        fields:
          - { label: "Titolo", name: "title", widget: "string" }
          - { label: "Icona", name: "icon",default: "file", widget: "hidden" }
          - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ" }
          - { label: "Estensione / Tipologia", name: "ext", widget: "string" }
