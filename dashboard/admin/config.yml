backend:
  name: git-gateway
  branch: "48892"

media_folder: "assets/uploads"   # cartella dove vengono caricati i file
public_folder: "/assets/uploads"

locale: it

collections:
  - name: "cartelle"
    label: "Cartelle didattiche"
    folder: "desk/cartelle"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    editor:
      preview: false
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "cartella" }
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Permalink", name: "permalink", widget: "string" }

      - label: "File"
        name: "files"
        widget: "list"
        summary: "{{fields.title}} ({{fields.ext}})"
        fields:
          - { label: "Titolo file", name: "title", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }
          - { label: "Icona", name: "icon", widget: "string", default: "file" }
          - { label: "Data", name: "date", widget: "string" }
          - label: "Estensione"
            name: "ext"
            widget: "select"
            options:
              - PDF
              - DOCX
              - PPTX
              - XLSX
              - LINK
