backend:
  name: git-gateway
  branch: "48892"

media_folder: "assets"
public_folder: "/assets"

collections:
  - name: "it"
    label: "Pagine"
    folder: "it"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
      - { name: "title", label: "Titolo", widget: "string" }
      - { name: "date", label: "Data", widget: "datetime", default: "", hidden: true }
      - { name: "permalink", label: "Link personalizzato", widget: "string", required: true }
      - { name: "body", label: "page", widget: "markdown" }
  - name: "posts"
    label: "Post"
    label_singular: "Post"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "posts/{{slug}}"
    sortable_fields: ['date', 'title']
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "Categoria", name: "categories", widget: "list", default: ["notizie"] }
      - { label: "Tag", name: "tags", widget: "list" }
      - { label: "Contenuto", name: "body", widget: "markdown" }
      - { label: "Autore", name: "autore", widget: "string", default: "Redazione: Gabriel Matteo Jones" }

backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: it

collections:
  - name: "desk"
    label: "desk"
    folder: "desk"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    editor:
      preview: false
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "cartella" }

      - { label: "Titolo", name: "title", widget: "string" }

      - { label: "Permalink", name: "permalink", widget: "string" }

      - label: "File"
        name: "files"
        widget: "list"
        summary: "{{fields.title}} ({{fields.ext}})"
        fields:
          - { label: "Titolo file", name: "title", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }
          - { label: "Icona", name: "icon", widget: "string", default: "file" }
          - { label: "Data", name: "date", widget: "string" }
          - label: "Estensione"
            name: "ext"
            widget: "select"
            options:
              - PDF
              - DOCX
              - PPTX
              - XLSX
              - LINK
