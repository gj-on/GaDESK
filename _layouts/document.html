<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap Italia -->
  <link rel="stylesheet" href="/assets/bootstrap-italia/css/bootstrap-italia.min.css">

  <style>
    body {
      font-family: "Titillium Web", Arial, sans-serif;
      background: #ffffff;
      color: #000;
      line-height: 1.65;
      margin: 0;
    }

    /* Layout generale */
    .page {
      display: grid;
      grid-template-columns: 220px 1fr;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Sidebar istituzionale */
    .sidebar {
      padding: 2.5rem 1.5rem;
      border-right: 1px solid #ddd;
      font-size: 0.9rem;
    }

    .sidebar img {
      max-width: 140px;
      margin-bottom: 1.5rem;
    }

    .sidebar .ente {
      font-weight: 700;
      margin-bottom: 1rem;
    }

    /* Contenuto */
    .content {
      padding: 3rem 4rem;
    }

    h1.document-title {
      text-transform: uppercase;
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .approvazione {
      text-align: center;
      font-size: 0.95rem;
      margin-bottom: 3.5rem;
    }

    article h2 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 2.4rem;
      margin-bottom: 0.8rem;
    }

    article p,
    article li {
      text-align: justify;
    }
/* Stampa / PDF */
@media print {
  body {
    font-size: 12pt;
    margin-top: 2cm;  /* margine superiore */
    margin-bottom: 2cm; /* margine inferiore */
    margin-left: 0;
    margin-right: 0;
    color: #000;
  }

  .page {
    display: block; /* grid non sempre funziona bene su PDF */
    margin: 2cm; /* margini superiori, inferiori e laterali */
  }

  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 200px;
    height: 100%;
    padding: 2cm 1cm;
    border-right: 1px solid #000;
    background: none;
  }

  .content {
    margin-left: 210px; /* lascia spazio per la sidebar */
    padding: 2cm;       /* margini uniformi su tutti i lati */
    top: 10;
    left: 10;
  }

  h1.document-title {
    page-break-after: 1rem;
  }

  article h2 {
    page-break-before: always;
  }

  hr {
    page-break-after: avoid;
    border: 0;
    border-top: 1px solid #000;
  }

  a {
    color: #000;
    text-decoration: none;
  }

  /* Forza il testo giustificato in stampa */
  article p, article li {
    text-align: justify;
  }
}

  </style>
</head>

<body>

<div class="page">

  <!-- Sidebar persistente -->
  <aside class="sidebar">
    <img src="https://www.regione.fvg.it/rafvg/export/sites/default/RAFVG/_config_/resp/img/logo_sm-n.png"
         alt="Regione Friuli Venezia Giulia">

    <div class="ente">
      {{ page.ente }}
    </div>

    <div class="small text-muted">
      Documento istituzionale<br>
      Pubblicazione web e stampa conforme
    </div>
  </aside>

  <!-- Contenuto -->
  <main class="content">

    <h1 class="document-title">
      {{ page.title }}
    </h1>

    {% if page.approvazione %}
      <div class="approvazione">
        {{ page.approvazione }}
      </div>
    {% endif %}

    <article>
      {{ content }}
    </article>

  </main>

</div>

<script src="/assets/bootstrap-italia/js/bootstrap-italia.bundle.min.js"></script>
</body>
</html>
