<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap Italia -->
  <link rel="stylesheet" href="/assets/bootstrap-italia/css/bootstrap-italia.min.css">

  <style>
    body {
      font-family: "Titillium Web", Arial, sans-serif;
      background-color: #ffffff;
      color: #000;
      line-height: 1.6;
    }

    .document-wrapper {
      max-width: 820px;
      margin: 0 auto;
      padding: 1rem;
    }

    .document-header img {
      max-height: 90px;
      margin-bottom: 1rem;
    }

    .document-title {
      text-transform: uppercase;
      font-weight: 700;
      font-size: 1.35rem;
      text-align: center;
      margin: 2.5rem 0;
    }

    .approvazione {
      text-align: center;
      font-size: 0.9rem;
      margin-bottom: 3rem;
    }

    article h2 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 2.2rem;
      margin-bottom: 0.8rem;
    }

    article p,
    article li {
      text-align: justify;
    }

    article ul,
    article ol {
      margin-left: 1.2rem;
    }

    hr {
      margin: 2rem 0;
    }

    @media print {
      body {
        font-size: 12pt;
      }
      a {
        color: #000;
        text-decoration: none;
      }
    }
  </style>
</head>

<body>

<main class="document-wrapper">

  <!-- Intestazione istituzionale -->
  <header class="document-header text-center mt-4 mb-4">
    {% if page.stemma %}
      <img src="https://www.regione.fvg.it/rafvg/export/sites/default/RAFVG/_config_/resp/img/logo_sm-n.png" alt="Stemma {{ page.ente }}">
    {% endif %}
    <div class="fw-bold">{{ page.ente }}</div>
  </header>

  <!-- Titolo -->
  <h1 class="document-title">
    {{ page.title }}
  </h1>

  {% if page.approvazione %}
    <div class="approvazione">
      {{ page.approvazione }}
    </div>
  {% endif %}

  <!-- Corpo documento -->
  <article>
    {{ content }}
  </article>

</main>

<script src="/assets/bootstrap-italia/js/bootstrap-italia.bundle.min.js"></script>
</body>
</html>
