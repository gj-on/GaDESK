<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>


  <style>
    /* Intestazione documento */
    .document-header img {
      max-height: 80px;
    }

    /* Stampa / PDF */
    @media print {
      .no-print { display: none; }
      body {
        font-size: 12pt;
      }
      .document-header {
        margin-bottom: 2rem;
      }
    }
  </style>
</head>

<body>

  <!-- Intestazione istituzionale -->
  <header class="document-header border-bottom py-3 mb-4">
    <div class="container">
      <div class="row align-items-center">

        <!-- Stemma -->
        <div class="col-2">
          {% if page.stemma %}
            <img src="https://www.regione.fvg.it/rafvg/export/sites/default/RAFVG/_config_/resp/img/logo_sm-n.png" alt="Stemma {{ page.ente }}">
          {% endif %}
        </div>

        <!-- Ente -->
        <div class="col-8 text-center">
          <div class="fw-bold text-uppercase">{{ page.ente }}</div>
          <div class="small">{{ page.ufficio }}</div>
        </div>

        <!-- Data -->
        <div class="col-2 text-end small">
          {{ page.date | date: "%d/%m/%Y" }}
        </div>

      </div>
    </div>
  </header>

  <!-- Corpo documento -->
  <main class="container mb-5">
    <h1 class="mb-2">{{ page.title }}</h1>

    {% if page.subtitle %}
      <h2 class="h5 text-muted mb-4">{{ page.subtitle }}</h2>
    {% endif %}

    <article class="mt-4">
      {{ content }}
    </article>
  </main>

  <!-- Footer minimale -->
  <footer class="border-top py-3 mt-5">
    <div class="container text-center text-muted small">
      Documento informatico ai sensi del CAD
    </div>
  </footer>

</body>
</html>
