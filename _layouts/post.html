---
layout: page
---
<section class="it-hero-wrapper it-dark it-overlay">
  <!-- - img-->
  <div class="img-responsive-wrapper">
    <div class="img-responsive">
    <div class="img-wrapper"><img src="https://arteascuola.com/it/wp-content/uploads/2014/04/2citt%C3%A0.jpg" title="Desk Office of Gabriel Jones" alt="Desk Office of Gabriel Jones"></div>
    </div>
  </div>
  <!-- - texts-->
  <div class="container">
    <div class="row">
        <div class="col-12">
          <div class="it-hero-text-wrapper bg-dark">
              <h2>{{ page.title }}</h2>
          </div>
        </div>
    </div>
  </div>
</section>
<article class="container my-4">
  <h1>{{ page.title }}</h1>

  <div class="entry">
    {{ content }}
  </div>

  <div class="date">
    Scritto il {{ page.date | date: "%d/%m/%Y" }}
  </div>

  {% include disqus.html %}
</article>
