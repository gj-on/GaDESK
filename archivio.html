---
layout: default
title: Archivio
permalink: /desk/archivio/
---

<!-- LISTA archivio -->
    <section class="col-md-10 archivio-list p-0" id="archivioList">
{% for archivio in site.archivio %}
  <div class="archivio-item" data-title="{{ archivio.title }}" data-from="{{ archivio.from }}" data-body="{{ archivio.content | markdownify }}">
    <div class="d-flex justify-content-between">
      <h6>{{ archivio.from }}</h6>
      <small>{{ archivio.date | date: "%d/%m/%Y" }}</small>
    </div>
    <p class="text-truncate">{{ archivio.title }}</p>
  </div>
{% endfor %}

    </section>


    <div id="archivioModal" class="modal-custom">
  <div class="modal-content-custom">
    <div class="modal-header-custom">
      <h5 id="modalTitle">Titolo archivio</h5>
      <button class="close-btn" id="closeModal">&times;</button>
    </div>
    <div id="modalFrom"><strong>Da:</strong> mittente</div>
    <div id="modalBody" style="margin-top:1rem; line-height:1.5;">Contenuto archivio</div>
  </div>
</div>

<script>
const archivioItems = document.querySelectorAll('.archivio-item');
const searchInput = document.getElementById('searchInput');
const modal = document.getElementById('archivioModal');
const modalTitle = document.getElementById('modalTitle');
const modalFrom = document.getElementById('modalFrom');
const modalBody = document.getElementById('modalBody');
const closeModal = document.getElementById('closeModal');

// Apri popup al click
archivioItems.forEach(item => {
  item.addEventListener('click', () => {
    modalTitle.textContent = item.dataset.title;
    modalFrom.innerHTML = `<strong>Da:</strong> ${item.dataset.from}`;
    modalBody.innerHTML = item.dataset.body;
    modal.style.display = 'block';
  });
});

closeModal.addEventListener('click', () => { modal.style.display = 'none'; });
window.addEventListener('click', (e) => { if(e.target==modal) modal.style.display='none'; });

// Ricerca archivio
searchInput.addEventListener('input', () => {
  const filter = searchInput.value.toLowerCase();
  archivioItems.forEach(item => {
    const title = item.dataset.title.toLowerCase();
    const from = item.dataset.from.toLowerCase();
    item.style.display = (title.includes(filter) || from.includes(filter)) ? '' : 'none';
  });
});
</script>
